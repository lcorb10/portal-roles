<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Portal de Roles: consulta tu acceso y administra roles y usuarios." />
    <meta name="theme-color" content="#1f1c1a" />
    <title>Portal de Roles</title>
    <script>
      // Aplica el tema antes de pintar para evitar un destello claro en modo oscuro.
      (function () {
        try {
          var t = localStorage.getItem("portal-tema");
          var oscuro = t === "oscuro" || (t !== "claro" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", oscuro);
          document.documentElement.style.colorScheme = oscuro ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
