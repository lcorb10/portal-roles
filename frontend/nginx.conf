# Límite de frecuencia para el inicio de sesión (protección contra bots, junto con la prueba de
# trabajo del backend): 1 petición por segundo por IP, con una ráfaga de 40.
limit_req_zone $binary_remote_addr zone=autenticacion:10m rate=60r/m;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Inicio de sesión y retos: con límite de frecuencia.
    location ~ ^/api/auth/(login|reto)$ {
        limit_req zone=autenticacion burst=40 nodelay;
        error_page 429 = @demasiadas;
        include /etc/nginx/snippets/proxy.conf;
    }

    # El resto de /api/ se reenvía al backend por su nombre dentro de la red de Podman.
    location /api/ {
        include /etc/nginx/snippets/proxy.conf;
    }

    location @demasiadas {
        default_type application/json;
        return 429 '{"detail":"Demasiadas peticiones. Espera un momento e intenta de nuevo."}';
    }

    # Versión publicada: la app la consulta para avisar cuando hay una nueva (nunca en caché).
    location = /version.json {
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/seguridad.conf;
        try_files $uri =404;
    }

    # Archivos con hash en el nombre: se pueden guardar en caché mucho tiempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/seguridad.conf;
        try_files $uri =404;
    }

    # Fallback de SPA: cualquier otra ruta (p. ej. /admin/usuarios) devuelve index.html,
    # así recargar la página sigue funcionando.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/seguridad.conf;
        try_files $uri /index.html;
    }
}
