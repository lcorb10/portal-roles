server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;


    # /api/ se reenvía al backend por su nombre dentro de la red de Podman.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        include /etc/nginx/snippets/seguridad.conf;
    }

    # Archivos con hash en el nombre: se pueden guardar en caché mucho tiempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/seguridad.conf;
        try_files $uri =404;
    }

    # Fallback de SPA: cualquier otra ruta (p. ej. /admin/usuarios) devuelve index.html,
    # así recargar la página sigue funcionando.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/seguridad.conf;
        try_files $uri $uri/ /index.html;
    }
}
